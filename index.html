<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Дорога Мертвецов</title>
<style>
  :root{
    --rust-dark:#2b1c14;
    --rust-mid:#4a3324;
    --rust-panel:#3a2a1e;
    --leather:#241812;
    --accent:#e0791f;
    --accent-bright:#ffb347;
    --blood:#a32020;
    --parchment:#d8c6a0;
    --parchment-dim:#a89876;
    --olive:#5c6b3f;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;
    font-family:'Segoe UI',Impact,'Arial Narrow',sans-serif;}
  #app{position:fixed;inset:0;overflow:hidden;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}

  /* ---------- shared screen chrome ---------- */
  .screen{position:absolute;inset:0;display:none;flex-direction:column;
    background:radial-gradient(ellipse at 50% 0%,#3a2a1e 0%, #150d08 78%);
    color:var(--parchment); z-index:20;}
  .screen.active{display:flex;}
  .metal-btn{
    background:linear-gradient(180deg,#6b5138,#3d2c1c);
    border:2px solid #17100a; border-radius:10px; color:var(--parchment);
    padding:10px 18px; font-weight:700; font-size:15px; letter-spacing:.3px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.15), 0 3px 0 #120b06, 0 4px 6px rgba(0,0,0,.5);
    cursor:pointer;
  }
  .metal-btn:active{transform:translateY(2px); box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 1px 0 #120b06;}
  .metal-btn.accent{background:linear-gradient(180deg,var(--accent-bright),var(--accent)); color:#2b1200; border-color:#7a3d05;}
  .rivet{position:absolute;width:9px;height:9px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#c9c1a8,#6b6248 60%,#2c2820);
    box-shadow:0 1px 2px rgba(0,0,0,.6);}

  /* ---------- MAIN MENU ---------- */
  #menuScreen{align-items:center; justify-content:center; gap:6px;}
  #menuScreen .title{
    font-size:min(11vw,58px); font-weight:900; letter-spacing:1px; text-align:center;
    color:var(--accent-bright); text-transform:uppercase;
    text-shadow:0 0 14px rgba(224,121,31,.6), 3px 3px 0 #1a0d02, -1px -1px 0 #1a0d02;
    line-height:1.05; margin-bottom:4px; transform:rotate(-2deg);
  }
  #menuScreen .subtitle{color:var(--parchment-dim);font-size:13px;letter-spacing:3px;text-transform:uppercase;margin-bottom:30px;}
  #menuScreen .menuBtns{display:flex;flex-direction:column;gap:14px;width:min(78vw,320px);}
  #menuScreen .menuBtns .metal-btn{font-size:20px;padding:16px;}
  #menuScreen .zombieDecor{position:absolute;bottom:0;left:0;right:0;height:90px;opacity:.5;
    background:linear-gradient(180deg,transparent,#0e0704 90%);}
  #menuScreen .stat{position:absolute;top:14px;right:16px;color:var(--parchment-dim);font-size:13px;text-align:right}
  #resetBtn{position:absolute;bottom:12px;left:16px;font-size:11px;color:#7a6a52;background:none;border:none;text-decoration:underline;cursor:pointer;}

  /* ---------- GARAGE ---------- */
  #garageScreen{justify-content:flex-start;}
  .garageTop{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 6px;}
  .money{font-size:22px;font-weight:900;color:#ff5b3d;text-shadow:1px 1px 0 #000;}
  .garageStage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(180deg,#4a3728 0%,#241a12 70%, #1a120b 100%);
    border-top:2px solid #6b5138;border-bottom:2px solid #17100a; overflow:hidden;}
  #carPreview{width:min(90vw,520px);height:220px;}
  .garageStage .arrow{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;
    display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--parchment-dim);
    background:rgba(0,0,0,.25);border-radius:8px;cursor:pointer;}
  .garageStage .arrow.left{left:6px;} .garageStage .arrow.right{right:6px;}
  .upgradeRow{display:flex;gap:8px;padding:10px;overflow-x:auto;background:#1c130d;
    border-top:2px solid #000;}
  .upgradeCell{flex:0 0 auto;width:76px;height:88px;background:linear-gradient(180deg,#4a3324,#2b1c14);
    border:2px solid #17100a;border-radius:8px;display:flex;flex-direction:column;align-items:center;
    justify-content:center;position:relative;cursor:pointer;}
  .upgradeCell.selected{border-color:var(--accent-bright); box-shadow:0 0 8px rgba(255,179,71,.6);}
  .upgradeCell .cost{position:absolute;top:2px;left:0;right:0;text-align:center;font-size:10px;color:#ffcf8a;font-weight:700;}
  .upgradeCell .icon{font-size:26px;margin-top:6px;}
  .upgradeCell .pips{display:flex;gap:2px;margin-top:6px;}
  .pip{width:6px;height:9px;background:#2b2013;border:1px solid #000;border-radius:1px;}
  .pip.filled{background:var(--accent-bright);}
  .garageBottomBar{display:flex;justify-content:space-between;padding:10px 12px;gap:10px;}

  #upgradeModal{position:absolute;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:30;}
  #upgradeModal.active{display:flex;}
  .modalCard{width:min(90vw,420px);background:linear-gradient(180deg,#5c4128,#2e2013);
    border:3px solid #17100a;border-radius:14px;padding:16px;position:relative;}
  .modalCard h3{margin:2px 0 10px;color:var(--accent-bright);font-size:22px;text-align:center;text-transform:uppercase;}
  .modalCard .desc{background:#1c130d;border:1px solid #000;border-radius:8px;padding:12px;display:flex;gap:12px;align-items:center;font-size:14px;color:var(--parchment);}
  .modalCard .desc .bigIcon{font-size:40px;}
  .modalCard .buyRow{display:flex;align-items:center;gap:10px;margin-top:14px;}
  .modalCard .buyRow .price{flex:0 0 auto;background:#1c130d;border:1px solid #000;border-radius:8px;padding:10px 14px;font-weight:800;color:#ffcf8a;}
  .modalCard .buyRow .pipsBig{flex:1;display:flex;gap:4px;background:#1c130d;border:1px solid #000;border-radius:8px;padding:10px;justify-content:center;}
  .pipBig{width:14px;height:22px;background:#2b2013;border:1px solid #000;}
  .pipBig.filled{background:linear-gradient(180deg,var(--accent-bright),var(--accent));}
  .modalCard .closeX{position:absolute;top:-12px;right:-12px;width:34px;height:34px;border-radius:50%;
    background:linear-gradient(180deg,#6b5138,#3d2c1c);border:2px solid #17100a;color:#ffe;font-weight:900;
    display:flex;align-items:center;justify-content:center;cursor:pointer;}

  /* ---------- HUD (in-run) ---------- */
  #hud{position:absolute;inset:0;pointer-events:none;z-index:10;display:none;}
  #hud.active{display:block;}
  .topBar{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;
    padding:10px 12px;}
  .moneyPill{pointer-events:auto;background:linear-gradient(180deg,#4a3324,#241a12);border:2px solid #17100a;
    border-radius:8px;padding:6px 12px;color:#ffcf8a;font-weight:800;display:flex;gap:6px;align-items:center;}
  .progressWrap{position:absolute;top:10px;left:96px;right:96px;height:22px;}
  .progressTrack{position:relative;height:2px;background:#8a7a5e;top:10px;}
  .progressDot{position:absolute;top:-9px;width:20px;height:20px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff,#e0791f 60%,#7a3d05);
    box-shadow:0 0 6px rgba(255,179,71,.8); transition:left .05s linear;}
  .progressMark{position:absolute;top:-6px;font-size:14px;color:#d8c6a0;transform:translateX(-50%);}
  .pauseBtn{pointer-events:auto;width:44px;height:44px;border-radius:8px;background:linear-gradient(180deg,#4a3324,#241a12);
    border:2px solid #17100a;color:#d8c6a0;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;}

  .ctrlBtn{pointer-events:auto;position:absolute;width:76px;height:76px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,rgba(216,198,160,.35),rgba(60,44,28,.35));
    border:3px solid rgba(216,198,160,.55);display:flex;align-items:center;justify-content:center;
    font-size:30px;color:rgba(216,198,160,.9);}
  .ctrlBtn:active{background:radial-gradient(circle at 35% 30%,rgba(255,179,71,.55),rgba(60,44,28,.5));}
  #tiltLeft{left:18px;bottom:112px;} #tiltRight{left:104px;bottom:26px;}
  #nitroBtn{right:18px;bottom:112px;} #resetCarBtn{right:104px;bottom:26px;}
  #nitroBtn.disabled{opacity:.35;}

  .dashboard{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:340px;height:120px;
    display:flex;gap:22px;align-items:flex-end;justify-content:center;opacity:.92;}
  .gauge{width:96px;height:96px;border-radius:50%;position:relative;
    background:radial-gradient(circle at 50% 40%,#2b2018,#0f0a06 75%);border:5px solid #17100a;
    box-shadow:inset 0 0 12px rgba(0,0,0,.8);}
  .gauge .needle{position:absolute;left:50%;top:50%;width:3px;height:38px;background:linear-gradient(180deg,#ff5b3d,#7a1c0c);
    transform-origin:50% 100%;border-radius:2px;}
  .gauge .label{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:9px;color:#a89876;}
  .fuelWarn{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);color:#ffd23f;font-size:38px;
    text-align:center;line-height:1;text-shadow:2px 2px 0 #000; font-weight:900; letter-spacing:1px; opacity:0; transition:opacity .3s;}
  .fuelWarn.show{opacity:1;}

  /* ---------- RESULT ---------- */
  #resultScreen{align-items:center;justify-content:center;}
  .resultCard{width:min(92vw,420px);background:linear-gradient(180deg,#4a3324,#241a12);
    border:3px solid #17100a;border-radius:14px;padding:20px;}
  .resultCard h2{text-align:center;color:var(--accent-bright);margin:0 0 4px;font-size:24px;text-transform:uppercase;}
  .resultCard .why{text-align:center;color:var(--parchment-dim);margin-bottom:14px;font-size:13px;}
  .statLine{display:flex;justify-content:space-between;padding:8px 4px;border-bottom:1px dashed #5c4128;font-size:15px;}
  .statLine .val{color:#ffcf8a;font-weight:800;}
  .statLine .plus{color:#8fd166;font-size:12px;margin-left:6px;}
  .totalLine{display:flex;justify-content:space-between;padding:12px 4px 4px;font-size:19px;font-weight:900;color:#ff5b3d;}
  .resultBtns{display:flex;gap:10px;margin-top:16px;}
  .resultBtns .metal-btn{flex:1;}

  #pauseScreen{align-items:center;justify-content:center;gap:14px;}
  #pauseScreen h2{color:var(--accent-bright);font-size:28px;text-transform:uppercase;}

  .toast{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);
    background:rgba(0,0,0,.7);color:#ffcf8a;padding:14px 20px;border-radius:10px;font-size:16px;
    z-index:40;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center;}
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <!-- MAIN MENU -->
  <div id="menuScreen" class="screen active">
    <div class="stat" id="menuStat"></div>
    <div class="title">Дорога<br>Мертвецов</div>
    <div class="subtitle">заработай, чтобы выжить</div>
    <div class="menuBtns">
      <button class="metal-btn accent" id="playBtn">▶ Играть</button>
      <button class="metal-btn" id="garageFromMenuBtn">🔧 Гараж</button>
    </div>
    <button id="resetBtn">сбросить прогресс</button>
    <div class="zombieDecor"></div>
  </div>

  <!-- GARAGE -->
  <div id="garageScreen" class="screen">
    <div class="garageTop">
      <button class="metal-btn" id="garageBackBtn">← Меню</button>
      <div class="money">💰 <span id="garageMoney">0</span></div>
      <button class="metal-btn accent" id="goBtn">Поехали! ▶</button>
    </div>
    <div class="garageStage">
      <canvas id="carPreview"></canvas>
    </div>
    <div class="upgradeRow" id="upgradeRow"></div>
    <div class="garageBottomBar">
      <div style="font-size:12px;color:var(--parchment-dim);align-self:center;">Лучшая дистанция: <b id="bestDistLabel" style="color:#ffcf8a;">0</b> фт</div>
    </div>
  </div>

  <!-- UPGRADE MODAL -->
  <div id="upgradeModal">
    <div class="modalCard">
      <div class="closeX" id="modalClose">✕</div>
      <h3 id="modalName">—</h3>
      <div class="desc"><div class="bigIcon" id="modalIcon">⚙</div><div id="modalDesc">—</div></div>
      <div class="buyRow">
        <div class="price">💰 <span id="modalCost">0</span></div>
        <div class="pipsBig" id="modalPips"></div>
        <button class="metal-btn accent" id="modalBuy">Купить</button>
      </div>
    </div>
  </div>

  <!-- HUD -->
  <div id="hud">
    <div class="topBar">
      <div class="moneyPill">💰 <span id="hudMoney">0</span></div>
      <div class="pauseBtn" id="pauseBtn">❚❚</div>
    </div>
    <div class="progressWrap">
      <div class="progressTrack"></div>
      <div class="progressDot" id="progressDot"></div>
      <div class="progressMark" id="finishMark" style="right:-6px;left:auto;">🏁</div>
    </div>
    <div class="ctrlBtn" id="tiltLeft">↺</div>
    <div class="ctrlBtn" id="tiltRight">↻</div>
    <div class="ctrlBtn" id="nitroBtn">🚀</div>
    <div class="ctrlBtn" id="resetCarBtn">🗑</div>
    <div class="dashboard">
      <div class="gauge"><div class="needle" id="fuelNeedle"></div><div class="label">FUEL</div></div>
      <div class="gauge"><div class="needle" id="speedNeedle"></div><div class="label">MPH</div></div>
      <div class="fuelWarn" id="fuelWarnEl">БЕНЗИН<br>КОНЧИЛСЯ</div>
    </div>
  </div>

  <!-- RESULT -->
  <div id="resultScreen" class="screen">
    <div class="resultCard">
      <h2 id="resultTitle">День завершён</h2>
      <div class="why" id="resultWhy">Бензин закончился</div>
      <div class="statLine"><span>Расстояние</span><span class="val" id="rDist">0 фт</span></div>
      <div class="statLine"><span>Зомби повержено</span><span class="val" id="rZombies">0</span></div>
      <div class="statLine"><span>Средняя скорость</span><span class="val" id="rSpeed">0 миль/ч</span></div>
      <div class="totalLine"><span>Всего денег</span><span id="rTotal">$0</span></div>
      <div class="resultBtns">
        <button class="metal-btn" id="retryBtn">↻ Ещё раз</button>
        <button class="metal-btn accent" id="toGarageBtn">🔧 Гараж</button>
      </div>
    </div>
  </div>

  <!-- PAUSE -->
  <div id="pauseScreen" class="screen">
    <h2>Пауза</h2>
    <button class="metal-btn accent" id="resumeBtn" style="width:220px;">▶ Продолжить</button>
    <button class="metal-btn" id="quitBtn" style="width:220px;">🔧 В гараж</button>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
(function(){
"use strict";

/* ============================================================
   PERSISTENCE
   ============================================================ */
const SAVE_KEY = "road_of_the_dead_save_v1";
const DEFAULT_SAVE = {
  money: 40,
  bestDistance: 0,
  levels: { engine:0, gearbox:0, wheels:0, weapon:0, nitro:0, armor:0, weight:0, fuel:0 }
};
let save = JSON.parse(JSON.stringify(DEFAULT_SAVE));

async function loadSave(){
  try{
    const res = await window.storage.get(SAVE_KEY, false);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      save = Object.assign(JSON.parse(JSON.stringify(DEFAULT_SAVE)), parsed);
      save.levels = Object.assign(JSON.parse(JSON.stringify(DEFAULT_SAVE.levels)), parsed.levels||{});
    }
  }catch(e){ /* no save yet — use defaults */ }
  refreshMenuStat();
}
let saveTimer=null;
function persist(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{ await window.storage.set(SAVE_KEY, JSON.stringify(save), false); }catch(e){ console.warn("save failed",e); }
  }, 250);
}

/* ============================================================
   UPGRADE DEFINITIONS
   ============================================================ */
const UPGRADES = [
  {key:"engine",  name:"Двигатель",     icon:"🔩", max:6, base:20, mult:1.55, desc:"Более быстрый разгон и более эффективный расход топлива."},
  {key:"gearbox", name:"Коробка передач", icon:"⚙", max:6, base:26, mult:1.55, desc:"Помогает быстрее набирать скорость и держать высокую передачу на подъёмах."},
  {key:"wheels",  name:"Колёса",       icon:"🛞", max:6, base:30, mult:1.55, desc:"Лучшее сцепление с дорогой, проще ехать в гору."},
  {key:"weapon",  name:"Оружие",       icon:"🔫", max:5, base:60, mult:1.6,  desc:"Отстреливает зомби, прежде чем они столкнутся с машиной."},
  {key:"nitro",   name:"Ускоритель",   icon:"🚀", max:5, base:40, mult:1.6,  desc:"Мощный кратковременный рывок вперёд и вверх."},
  {key:"armor",   name:"Броня",        icon:"🛡", max:6, base:24, mult:1.5,  desc:"Защищает машину от повреждений при ударах."},
  {key:"weight",  name:"Развесовка",   icon:"⚖", max:6, base:22, mult:1.5,  desc:"Перераспределение веса помогает пробиваться сквозь зомби и препятствия."},
  {key:"fuel",    name:"Топливный бак", icon:"⛽", max:6, base:18, mult:1.5, desc:"Увеличение ёмкости топливного бака, чтобы проезжать большее расстояние."},
];
function upgradeCost(def, level){
  if(level>=def.max) return null;
  return Math.round(def.base * Math.pow(def.mult, level));
}

/* derived car stats from levels */
function carStats(){
  const L = save.levels;
  return {
    accel:      420 + L.engine*95 + L.gearbox*40,
    maxSpeed:   360 + L.engine*30 + L.gearbox*55,
    grip:       0.55 + L.wheels*0.06,
    fuelCap:    100 + L.fuel*40,
    fuelUse:    9 - L.engine*0.5,
    weaponLvl:  L.weapon,
    weaponRange: 260 + L.weapon*70,
    weaponRate: Math.max(0.15, 0.62 - L.weapon*0.09),
    nitroLvl:   L.nitro,
    nitroPower: 700 + L.nitro*180,
    nitroCap:   L.nitro>0 ? (30 + L.nitro*18) : 0,
    armor:      L.armor,
    dmgReduce:  Math.min(0.75, L.armor*0.11),
    weight:     L.weight,
    knockReduce: Math.min(0.7, L.weight*0.1),
  };
}

/* ============================================================
   CANVAS / RESIZE
   ============================================================ */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let W=0,H=0,DPR=1;
function resize(){
  DPR = Math.min(2, window.devicePixelRatio||1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W*DPR; canvas.height = H*DPR;
  canvas.style.width=W+"px"; canvas.style.height=H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener("resize", resize);
resize();

/* ============================================================
   TERRAIN
   ============================================================ */
const GROUND_BASE = 430;
function terrainY(x){
  return GROUND_BASE
    + Math.sin(x*0.0021)*46
    + Math.sin(x*0.0049+1.3)*24
    + Math.sin(x*0.00097+2.1)*70
    + Math.sin(x*0.021+0.5)*4;
}
function terrainSlope(x){
  const d=2; return (terrainY(x+d)-terrainY(x-d))/(2*d);
}

/* Obstacles (crates) & zombies are generated as the run progresses */
let obstacles = []; // {x, w, h, alive}
let zombies = [];   // {x, alive, walkPhase, deathT}
let particles = [];
let popups = []; // floating money text
const FINISH_DISTANCE = 9000; // "feet" to reach rescue plane

function seedWorld(){
  obstacles = []; zombies = []; particles = []; popups = [];
  let x = 900;
  while(x < FINISH_DISTANCE*1.2){
    if(Math.random()<0.55){
      obstacles.push({x: x, w: 34+Math.random()*30, h: 26+Math.random()*46, alive:true});
    }
    x += 260 + Math.random()*420;
  }
  x = 500;
  while(x < FINISH_DISTANCE*1.2){
    const n = 1+Math.floor(Math.random()*3);
    for(let i=0;i<n;i++){
      zombies.push({x:x+i*(28+Math.random()*20), alive:true, walkPhase:Math.random()*10, deathT:0});
    }
    x += 180 + Math.random()*300;
  }
}

/* ============================================================
   CAR / PHYSICS
   ============================================================ */
const WHEEL_R = 17;
const HALF_BASE = 44;
const RIDE_HEIGHT = 30;

let car, run;

function newCar(){
  const y0 = terrainY(0)-RIDE_HEIGHT-WHEEL_R;
  return {
    x:0, y:y0, angle:0, vx:0, vy:0, av:0,
    grounded:true,
    fuel:100, fuelCap:100,
    nitroFuel:0, nitroCap:0, nitroActive:false,
    health:100,
    flipTimer:0,
    weaponCd:0,
  };
}
function newRun(){
  return {
    state:"idle", // idle|playing|paused|ended
    throttle:0, tiltL:false, tiltR:false, nitro:false,
    distanceFt:0, zombiesKilled:0, moneyEarned:0,
    speedSamples:[], startMoney: save.money,
    endReason:"", cameraX:0,
    wreckerCooldown:0,
  };
}

function resetRunObjects(){
  const stats = carStats();
  car = newCar();
  car.fuelCap = stats.fuelCap; car.fuel = stats.fuelCap;
  car.nitroCap = stats.nitroCap; car.nitroFuel = stats.nitroCap;
  run = newRun();
  seedWorld();
}

function pxToFeet(px){ return Math.max(0, Math.round(px*0.11)); }

function spawnParticles(x,y,color,count,spread,speed,life){
  for(let i=0;i<count;i++){
    const a = Math.random()*Math.PI*2;
    const s = speed*(0.4+Math.random()*0.8);
    particles.push({
      x,y, vx:Math.cos(a)*s, vy:Math.sin(a)*s - speed*0.3,
      life: life*(0.6+Math.random()*0.6), t:0, color, r:2+Math.random()*3
    });
  }
}
function spawnPopup(x,y,text,color){
  popups.push({x,y,text,color,t:0,life:1.0});
}

function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i]; p.t+=dt;
    if(p.t>p.life){ particles.splice(i,1); continue; }
    p.vy += 900*dt;
    p.x += p.vx*dt; p.y += p.vy*dt;
  }
  for(let i=popups.length-1;i>=0;i--){
    const p=popups[i]; p.t+=dt/p.life;
    if(p.t>=1){ popups.splice(i,1); continue; }
    p.y -= 40*dt;
  }
}

/* ---- input state ---- */
const input = {left:false,right:false,gas:false,nitro:false};

function stepPhysics(dt){
  const stats = carStats();
  const gravity = 1500;

  // world x of wheels (approx, ignore small angle skew on x for stability)
  const cosA=Math.cos(car.angle), sinA=Math.sin(car.angle);
  const rearX = car.x - HALF_BASE*cosA;
  const frontX = car.x + HALF_BASE*cosA;
  const groundRearY = terrainY(rearX) - WHEEL_R;
  const groundFrontY = terrainY(frontX) - WHEEL_R;
  const desiredY = (groundRearY+groundFrontY)/2 - RIDE_HEIGHT + HALF_BASE*Math.abs(sinA)*0.15;
  const desiredAngle = Math.atan2(groundFrontY-groundRearY, frontX-rearX);

  const gap = desiredY - car.y;
  const suspensionTravel = 46;

  const wasGrounded = car.grounded;
  car.grounded = gap < suspensionTravel && gap > -80;

  if(car.grounded){
    // spring-damper suspension
    const k=210, damp=14;
    car.vy += (gap*k - car.vy*damp)*dt;
    // landing impact damage
    if(!wasGrounded && car.vy>0){
      const impact = Math.max(0, car.vy-520);
      if(impact>0){
        const dmg = impact*0.045*(1-stats.dmgReduce*0.6);
        applyDamage(dmg);
      }
    }
    // angle spring toward ground slope
    let dAng = desiredAngle-car.angle;
    while(dAng>Math.PI) dAng-=2*Math.PI; while(dAng<-Math.PI) dAng+=2*Math.PI;
    car.av += (dAng*40 - car.av*8)*dt;
  } else {
    car.vy += gravity*dt;
    car.av *= (1-1.2*dt);
  }

  // steering / tilt in air (and light effect on ground for wheelies)
  const tiltForce = car.grounded? 3.2 : 7.2;
  if(input.left)  car.av -= tiltForce*dt*60*0.06;
  if(input.right) car.av += tiltForce*dt*60*0.06;

  car.angle += car.av*dt;
  car.av *= 0.992;

  // throttle
  let accel = 0;
  const hasFuel = car.fuel>0;
  if(input.gas && hasFuel){
    accel = stats.accel;
    const slope = terrainSlope(car.x);
    accel *= (1 - Math.max(0,slope)*(1-stats.grip)*1.6);
    car.fuel = Math.max(0, car.fuel - stats.fuelUse*dt*10);
  }
  // nitro
  car.nitroActive = false;
  if(input.nitro && car.nitroFuel>0 && stats.nitroLvl>0){
    car.nitroActive = true;
    accel += stats.nitroPower;
    car.nitroFuel = Math.max(0, car.nitroFuel - dt*22);
    if(car.grounded) car.vy -= 260*dt*60*0.02;
    spawnParticles(car.x-HALF_BASE*cosA-6, car.y+10, "rgba(255,150,40,0.9)", 1, 0, 60, 0.3);
  }

  const forwardX = cosA;
  if(car.grounded){
    car.vx += forwardX*accel*dt;
    // ground friction / rolling resistance
    car.vx *= (1-0.55*dt);
    if(!input.gas || !hasFuel) car.vx *= (1-1.1*dt);
  } else {
    car.vx *= (1-0.15*dt);
  }
  // clamp top speed
  const maxV = stats.maxSpeed + (car.nitroActive? 260:0);
  if(car.vx>maxV) car.vx = maxV;
  if(car.vx<-maxV*0.5) car.vx=-maxV*0.5;

  // air drag on vy
  car.vy *= (1-0.02*dt*60*0.02);

  car.x += car.vx*dt;
  car.y += car.vy*dt;
  if(car.x<0){car.x=0; car.vx=Math.max(0,car.vx);}

  // flip detection
  const upright = Math.cos(car.angle) > -0.2;
  if(!upright && car.grounded && Math.abs(car.vx)<20){
    car.flipTimer += dt;
  } else car.flipTimer = Math.max(0, car.flipTimer-dt*2);

  // obstacles
  for(const o of obstacles){
    if(!o.alive) continue;
    if(Math.abs(o.x-car.x) < 44+o.w/2){
      o.alive=false;
      const dmg = Math.max(4, 22-stats.armor*2.4);
      applyDamage(dmg);
      car.vx *= (1-0.5*(1-stats.knockReduce));
      spawnParticles(o.x, terrainY(o.x)-o.h/2, "rgba(150,110,60,0.95)", 14, 0, 260, 0.6);
      spawnPopup(o.x, terrainY(o.x)-o.h-10, "УДАР!", "#ff5b3d");
    }
  }

  // weapon auto-fire
  car.weaponCd -= dt;
  if(stats.weaponLvl>0 && car.weaponCd<=0){
    let target=null, bestD=stats.weaponRange;
    for(const z of zombies){
      if(!z.alive) continue;
      const d = z.x-car.x;
      if(d>0 && d<bestD){ bestD=d; target=z; }
    }
    if(target){
      killZombie(target, true);
      car.weaponCd = stats.weaponRate;
    }
  }

  // zombie collision (car body)
  for(const z of zombies){
    if(!z.alive) continue;
    if(Math.abs(z.x-car.x) < 46){
      killZombie(z, false);
    }
  }

  // update zombies walking
  for(const z of zombies){
    if(!z.alive){ z.deathT+=dt; continue; }
    z.walkPhase += dt*4;
    if(z.x - car.x < 900) z.x -= 22*dt; // shamble toward car
  }

  run.distanceFt = pxToFeet(car.x);
  run.speedSamples.push(Math.abs(car.vx));
  if(run.speedSamples.length>600) run.speedSamples.shift();
}

function applyDamage(dmg){
  car.health = Math.max(0, car.health-dmg);
  if(car.health<=0 && run.state==="playing"){
    endRun("Машина сломалась");
  }
}

function killZombie(z, byWeapon){
  z.alive=false; z.deathT=0;
  run.zombiesKilled++;
  const reward = byWeapon? 2:1;
  run.moneyEarned += reward;
  spawnParticles(z.x, terrainY(z.x)-40, "rgba(120,170,60,0.95)", 16, 0, 240, 0.7);
  spawnParticles(z.x, terrainY(z.x)-40, "rgba(160,20,20,0.9)", 8, 0, 180, 0.5);
  spawnPopup(z.x, terrainY(z.x)-70, "+"+reward+"$", "#8fd166");
}

/* ============================================================
   RUN LIFECYCLE
   ============================================================ */
function startRun(){
  resetRunObjects();
  run.state="playing";
  showScreen(null);
  document.getElementById("hud").classList.add("active");
}

function endRun(reason){
  if(run.state==="ended") return;
  run.state="ended";
  run.endReason = reason;
  const distMoney = Math.round(run.distanceFt/25);
  const avgSpeed = run.speedSamples.length? (run.speedSamples.reduce((a,b)=>a+b,0)/run.speedSamples.length) : 0;
  const speedMph = avgSpeed*0.045;
  const speedMoney = Math.round(speedMph);
  const total = distMoney + run.zombiesKilled*1 + run.moneyEarned + speedMoney;
  save.money += total;
  save.bestDistance = Math.max(save.bestDistance, run.distanceFt);
  persist();

  document.getElementById("hud").classList.remove("active");
  document.getElementById("resultTitle").textContent = (car.x>=FINISH_DISTANCE)? "Уровень пройден!":"День завершён";
  document.getElementById("resultWhy").textContent = reason;
  document.getElementById("rDist").textContent = run.distanceFt+" фт";
  document.getElementById("rZombies").textContent = run.zombiesKilled;
  document.getElementById("rSpeed").textContent = speedMph.toFixed(1)+" миль/ч";
  document.getElementById("rTotal").textContent = "$"+total;
  showScreen("resultScreen");
}

/* ============================================================
   RENDER
   ============================================================ */
function drawBackground(camX){
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,"#2c3a52"); grad.addColorStop(0.55,"#7d5a3f"); grad.addColorStop(1,"#c9925a");
  ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);

  // parallax buildings
  drawBuildingLayer(camX*0.25, H*0.62, "#5a4636", 140, 0.55);
  drawBuildingLayer(camX*0.45, H*0.68, "#3d2f22", 100, 0.8);
}
function hashRand(seed){ const x=Math.sin(seed*127.1)*43758.5453; return x-Math.floor(x); }
function drawBuildingLayer(camX, baseY, color, unit, alpha){
  ctx.globalAlpha=alpha; ctx.fillStyle=color;
  const start = Math.floor((camX-200)/unit)-1;
  const end = Math.floor((camX+W+200)/unit)+1;
  for(let i=start;i<=end;i++){
    const h = 60+hashRand(i+ (color.length))*220;
    const bx = i*unit - camX;
    ctx.fillRect(bx, baseY-h, unit*0.78, h);
    // windows
    ctx.globalAlpha=alpha*0.5; ctx.fillStyle="#1a140d";
    for(let wy=baseY-h+14; wy<baseY-10; wy+=22){
      for(let wx=bx+8; wx<bx+unit*0.78-10; wx+=16){
        if(hashRand(i*13+wx+wy)>0.4) ctx.fillRect(wx,wy,7,10);
      }
    }
    ctx.globalAlpha=alpha; ctx.fillStyle=color;
  }
  ctx.globalAlpha=1;
}

function drawGround(camX){
  ctx.beginPath();
  const step=14;
  ctx.moveTo(0,H);
  for(let sx=0; sx<=W+step; sx+=step){
    const wx = sx+camX;
    ctx.lineTo(sx, terrainY(wx)-camY_offset());
  }
  ctx.lineTo(W,H); ctx.closePath();
  const g = ctx.createLinearGradient(0,H*0.5,0,H);
  g.addColorStop(0,"#4a3324"); g.addColorStop(1,"#1c130d");
  ctx.fillStyle=g; ctx.fill();
  ctx.strokeStyle="#241a12"; ctx.lineWidth=3; ctx.stroke();
}

let CAM_Y=0;
function camY_offset(){ return CAM_Y; }

function worldToScreen(wx, wy, camX){ return [wx-camX, wy-CAM_Y]; }

function drawObstacle(o, camX){
  const gy = terrainY(o.x)-CAM_Y;
  const [sx] = [o.x-camX];
  if(sx<-80||sx>W+80) return;
  ctx.save();
  ctx.translate(sx, gy);
  ctx.fillStyle="#8a5a2e"; ctx.strokeStyle="#3a2410"; ctx.lineWidth=2;
  ctx.fillRect(-o.w/2,-o.h,o.w,o.h);
  ctx.strokeRect(-o.w/2,-o.h,o.w,o.h);
  ctx.strokeStyle="#c98a4a";
  ctx.beginPath(); ctx.moveTo(-o.w/2,-o.h); ctx.lineTo(o.w/2,0);
  ctx.moveTo(o.w/2,-o.h); ctx.lineTo(-o.w/2,0); ctx.stroke();
  ctx.restore();
}

function drawZombie(z, camX){
  const sx = z.x-camX;
  if(sx<-60||sx>W+60) return;
  const gy = terrainY(z.x)-CAM_Y;
  ctx.save();
  ctx.translate(sx,gy);
  if(!z.alive){
    ctx.globalAlpha = Math.max(0,1-z.deathT*0.8);
    ctx.rotate(Math.PI/2);
    ctx.translate(-16,6);
  }
  const bob = z.alive? Math.sin(z.walkPhase)*2 : 0;
  ctx.translate(0,bob);
  // legs
  ctx.strokeStyle="#3d5a2a"; ctx.lineWidth=6; ctx.lineCap="round";
  const legSwing = z.alive? Math.sin(z.walkPhase)*8 : 0;
  ctx.beginPath(); ctx.moveTo(0,-24); ctx.lineTo(-6+legSwing,-2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,-24); ctx.lineTo(6-legSwing,-2); ctx.stroke();
  // body
  ctx.fillStyle="#6b8a3e";
  ctx.beginPath(); ctx.ellipse(0,-34,9,13,0,0,Math.PI*2); ctx.fill();
  // arms reaching
  ctx.strokeStyle="#5c7a34"; ctx.lineWidth=5;
  const armSwing = z.alive? Math.sin(z.walkPhase*1.3)*6 : 0;
  ctx.beginPath(); ctx.moveTo(0,-40); ctx.lineTo(14+armSwing,-38); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,-40); ctx.lineTo(-12,-30); ctx.stroke();
  // head
  ctx.fillStyle="#7fa04a";
  ctx.beginPath(); ctx.arc(0,-50,8,0,Math.PI*2); ctx.fill();
  ctx.fillStyle="#c0392b";
  ctx.fillRect(-4,-52,3,2); ctx.fillRect(2,-52,3,2);
  ctx.restore();
}

function drawCar(){
  const sx = W*0.32;
  const sy = car.y-CAM_Y;
  ctx.save();
  ctx.translate(sx,sy);
  ctx.rotate(car.angle);

  // wheels
  const wheelAng = (car.x*0.05)%(Math.PI*2);
  drawWheel(-HALF_BASE, RIDE_HEIGHT-4, wheelAng);
  drawWheel(HALF_BASE, RIDE_HEIGHT-4, wheelAng);

  // chassis
  ctx.fillStyle="#c7c2b6";
  ctx.strokeStyle="#3a352a"; ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(-HALF_BASE-14, RIDE_HEIGHT-6);
  ctx.lineTo(-HALF_BASE-14, -6);
  ctx.lineTo(-16,-30);
  ctx.lineTo(20,-30);
  ctx.lineTo(HALF_BASE+8,-2);
  ctx.lineTo(HALF_BASE+14, RIDE_HEIGHT-6);
  ctx.closePath(); ctx.fill(); ctx.stroke();

  // cabin glass
  ctx.fillStyle="rgba(70,90,110,0.6)";
  ctx.beginPath();
  ctx.moveTo(-12,-27); ctx.lineTo(-4,-8); ctx.lineTo(16,-8); ctx.lineTo(16,-27); ctx.closePath();
  ctx.fill();

  const stats = carStats();
  // armor plating visual
  if(stats.armor>0){
    ctx.strokeStyle="#8a6a3a"; ctx.lineWidth=2+Math.min(4,stats.armor);
    ctx.strokeRect(-HALF_BASE-12,-4, HALF_BASE*2+22, RIDE_HEIGHT-2);
  }
  // weapon
  if(stats.weaponLvl>0){
    ctx.strokeStyle="#3a352a"; ctx.lineWidth=6; ctx.lineCap="round";
    ctx.beginPath(); ctx.moveTo(HALF_BASE+6,-18); ctx.lineTo(HALF_BASE+34,-22); ctx.stroke();
  }
  // nitro flame
  if(car.nitroActive){
    ctx.fillStyle="rgba(255,150,40,0.9)";
    ctx.beginPath(); ctx.moveTo(-HALF_BASE-14,4); ctx.lineTo(-HALF_BASE-14-24-Math.random()*10,10); ctx.lineTo(-HALF_BASE-14,16); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}
function drawWheel(lx,ly,ang){
  ctx.save(); ctx.translate(lx,ly); ctx.rotate(ang);
  ctx.fillStyle="#161310"; ctx.beginPath(); ctx.arc(0,0,WHEEL_R,0,Math.PI*2); ctx.fill();
  ctx.fillStyle="#8a8478"; ctx.beginPath(); ctx.arc(0,0,6,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle="#8a8478"; ctx.lineWidth=2;
  for(let i=0;i<5;i++){
    const a=i/5*Math.PI*2;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*13,Math.sin(a)*13); ctx.stroke();
  }
  ctx.restore();
}

function drawParticles(camX){
  for(const p of particles){
    const a = Math.max(0,1-p.t/p.life);
    ctx.globalAlpha=a;
    ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x-camX,p.y-CAM_Y,p.r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
  for(const p of popups){
    const a = Math.max(0,1-p.t);
    ctx.globalAlpha=a;
    ctx.fillStyle=p.color; ctx.font="bold 15px Arial"; ctx.textAlign="center";
    ctx.fillText(p.text, p.x-camX, p.y-CAM_Y-p.t*20);
  }
  ctx.globalAlpha=1; ctx.textAlign="left";
}

function render(){
  ctx.clearRect(0,0,W,H);
  if(run.state!=="playing" && run.state!=="paused") return;
  const camX = car.x - W*0.32;
  CAM_Y = 0;
  drawBackground(camX);
  drawGround(camX);
  for(const o of obstacles) drawObstacle(o, camX);
  for(const z of zombies) drawZombie(z, camX);
  drawParticles(camX);
  drawCar();
}

/* ============================================================
   HUD UPDATES
   ============================================================ */
function updateHud(){
  document.getElementById("hudMoney").textContent = save.money + run.moneyEarned + Math.round(run.distanceFt/25);
  const pct = Math.min(1, car.x/FINISH_DISTANCE);
  document.getElementById("progressDot").style.left = (pct*100)+"%";
  const stats = carStats();
  const fuelPct = car.fuel/car.fuelCap;
  document.getElementById("fuelNeedle").style.transform = `translate(-50%,0) rotate(${-90+fuelPct*180}deg)`;
  const speedPct = Math.min(1, Math.abs(car.vx)/700);
  document.getElementById("speedNeedle").style.transform = `translate(-50%,0) rotate(${-90+speedPct*180}deg)`;
  document.getElementById("fuelWarnEl").classList.toggle("show", car.fuel<=0);
  const nitroBtn = document.getElementById("nitroBtn");
  nitroBtn.classList.toggle("disabled", stats.nitroLvl===0 || car.nitroFuel<=0);
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
let lastT=performance.now();
function loop(now){
  const dt = Math.min(0.035, (now-lastT)/1000);
  lastT = now;

  if(run && run.state==="playing"){
    input.gas = run.throttle>0;
    input.left = run.tiltL;
    input.right = run.tiltR;
    input.nitro = run.nitro;
    stepPhysics(dt);
    updateParticles(dt);
    updateHud();

    if(car.x>=FINISH_DISTANCE){
      endRun("Вы добрались до спасательного самолёта!");
    } else if(car.fuel<=0 && Math.abs(car.vx)<4 && car.grounded){
      endRun("Бензин закончился");
    } else if(car.flipTimer>1.4){
      endRun("Машина перевернулась");
    }
  }
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function drawCarPreview(){
  const cv = document.getElementById("carPreview");
  const dpr = Math.min(2,window.devicePixelRatio||1);
  const cw = cv.clientWidth||360, ch = cv.clientHeight||220;
  cv.width=cw*dpr; cv.height=ch*dpr;
  const c2 = cv.getContext("2d");
  c2.setTransform(dpr,0,0,dpr,0,0);
  c2.clearRect(0,0,cw,ch);
  c2.save();
  c2.translate(cw/2, ch/2+30);
  c2.scale(1.6,1.6);
  const oldCtx=ctx; // temporarily reuse drawCar-style rendering via manual replica
  drawCarStatic(c2);
  c2.restore();
}
function drawCarStatic(c2){
  const stats = carStats();
  c2.save();
  c2.fillStyle="#161310";
  [ -HALF_BASE, HALF_BASE].forEach(lx=>{
    c2.beginPath(); c2.arc(lx, RIDE_HEIGHT-4, WHEEL_R, 0, Math.PI*2); c2.fill();
    c2.fillStyle="#8a8478"; c2.beginPath(); c2.arc(lx,RIDE_HEIGHT-4,6,0,Math.PI*2); c2.fill();
    c2.fillStyle="#161310";
  });
  c2.fillStyle="#c7c2b6"; c2.strokeStyle="#3a352a"; c2.lineWidth=3;
  c2.beginPath();
  c2.moveTo(-HALF_BASE-14, RIDE_HEIGHT-6);
  c2.lineTo(-HALF_BASE-14, -6);
  c2.lineTo(-16,-30);
  c2.lineTo(20,-30);
  c2.lineTo(HALF_BASE+8,-2);
  c2.lineTo(HALF_BASE+14, RIDE_HEIGHT-6);
  c2.closePath(); c2.fill(); c2.stroke();
  c2.fillStyle="rgba(70,90,110,0.6)";
  c2.beginPath(); c2.moveTo(-12,-27); c2.lineTo(-4,-8); c2.lineTo(16,-8); c2.lineTo(16,-27); c2.closePath(); c2.fill();
  if(stats.armor>0){ c2.strokeStyle="#8a6a3a"; c2.lineWidth=2+Math.min(4,stats.armor); c2.strokeRect(-HALF_BASE-12,-4, HALF_BASE*2+22, RIDE_HEIGHT-2); }
  if(stats.weaponLvl>0){ c2.strokeStyle="#3a352a"; c2.lineWidth=6; c2.lineCap="round"; c2.beginPath(); c2.moveTo(HALF_BASE+6,-18); c2.lineTo(HALF_BASE+34,-22); c2.stroke(); }
  c2.restore();
}

function openUpgradeModal(key){
  selectedUpgrade = key;
  const def = UPGRADES.find(u=>u.key===key);
  const lvl = save.levels[key];
  const cost = upgradeCost(def, lvl);
  document.getElementById("modalName").textContent = def.name;
  document.getElementById("modalIcon").textContent = def.icon;
  document.getElementById("modalDesc").textContent = def.desc;
  document.getElementById("modalCost").textContent = cost===null? "—" : cost;
  const pipsWrap = document.getElementById("modalPips");
  pipsWrap.innerHTML="";
  for(let i=0;i<def.max;i++){
    const d=document.createElement("div");
    d.className="pipBig"+(i<lvl?" filled":"");
    pipsWrap.appendChild(d);
  }
  const buyBtn = document.getElementById("modalBuy");
  if(cost===null){ buyBtn.textContent="Макс."; buyBtn.disabled=true; }
  else { buyBtn.textContent="Купить"; buyBtn.disabled = save.money<cost; }
  document.getElementById("upgradeModal").classList.add("active");
}
document.getElementById("modalClose").onclick = ()=> document.getElementById("upgradeModal").classList.remove("active");
document.getElementById("modalBuy").onclick = ()=>{
  const def = UPGRADES.find(u=>u.key===selectedUpgrade);
  const lvl = save.levels[selectedUpgrade];
  const cost = upgradeCost(def, lvl);
  if(cost===null || save.money<cost) return;
  save.money -= cost;
  save.levels[selectedUpgrade] = lvl+1;
  persist();
  openUpgradeModal(selectedUpgrade);
  renderGarage();
};

/* ---- controls: hold-to-drive on canvas, buttons for tilt/nitro/reset ---- */
function bindHold(el, onDown, onUp){
  el.addEventListener("pointerdown", e=>{ e.preventDefault(); onDown(); el.setPointerCapture && el.setPointerCapture(e.pointerId); });
  el.addEventListener("pointerup", e=>{ onUp(); });
  el.addEventListener("pointercancel", ()=> onUp());
  el.addEventListener("pointerleave", ()=> onUp());
}
bindHold(document.getElementById("tiltLeft"), ()=>{run.tiltL=true;}, ()=>{run.tiltL=false;});
bindHold(document.getElementById("tiltRight"), ()=>{run.tiltR=true;}, ()=>{run.tiltR=false;});
bindHold(document.getElementById("nitroBtn"), ()=>{run.nitro=true;}, ()=>{run.nitro=false;});
document.getElementById("resetCarBtn").addEventListener("pointerdown", e=>{
  e.preventDefault();
  if(run.state!=="playing") return;
  car.angle=0; car.av=0; car.vx*=0.3; car.vy=0;
  car.y = terrainY(car.x)-RIDE_HEIGHT-WHEEL_R-4;
  car.flipTimer=0;
});
bindHold(canvas, ()=>{ if(run && run.state==="playing") run.throttle=1; }, ()=>{ if(run) run.throttle=0; });

/* keyboard for desktop testing */
window.addEventListener("keydown", e=>{
  if(!run) return;
  if(e.code==="ArrowUp"||e.code==="Space") run.throttle=1;
  if(e.code==="ArrowLeft") run.tiltL=true;
  if(e.code==="ArrowRight") run.tiltR=true;
  if(e.code==="ShiftLeft") run.nitro=true;
});
window.addEventListener("keyup", e=>{
  if(!run) return;
  if(e.code==="ArrowUp"||e.code==="Space") run.throttle=0;
  if(e.code==="ArrowLeft") run.tiltL=false;
  if(e.code==="ArrowRight") run.tiltR=false;
  if(e.code==="ShiftLeft") run.nitro=false;
});

/* ============================================================
   BOOT
   ============================================================ */
run = newRun();
car = newCar();
loadSave();
})();
</script>
