ui(`<div class="p big"><div class=logo><span>🔫</span><div><div class=ttl>ДУЭЛЬ<span>3D</span></div><div class=sm>Найди врага. Прицелься. Один выстрел.</div></div></div>

(m.hed||[]).forEach(a=>{x.strokeStyle='#2e7a38';x.lineWidth=7;x.beginPath();x.moveTo(X(a[0]),X(a[1]));x.lineTo(X(a[2]),X(a[3]));x.stroke()});
m.seg.forEach(a=>{x.beginPath();x.moveTo(X(a[0]),X(a[1]));x.lineTo(X(a[2]),X(a[3]));x.strokeStyle='#000b';x.lineWidth=6;x.stroke();x.strokeStyle=hex(m.wc);x.lineWidth=4;x.stroke()});
x.strokeStyle='#000';x.lineWidth=5;x.strokeRect(X(-20),X(-20),40*s,40*s);x.fillStyle='#3b82f6';x.beginPath();x.arc(X(m.sp[0][0]),X(m.sp[0][1]),7,0,7);x.fill();x.fillStyle='#ef4444';x.beginPath();x.arc(X(m.sp[1][0]),X(m.sp[1][1]),7,0,7);x.fill();return TH[i]=c.toDataURL()}
function vote(mode){G.pmode=mode;ui(`<div class="p wide"><h1>${mode=='bot'?'🤖 Бой с ботом':'🗺 Карта'}</h1>${mode=='bot'?`<div class=sm>Сложность</div><div class=dfs>${DF.map((d,i)=>`<button class="df ${(S.diff==null?1:S.diff)==i?'on':''}" onclick="setDiff(${i})"><i>${d.i}</i><b>${d.n}</b><small>${['мазила','стандарт','со способностями'][i]}</small></button>`).join('')}</div>`:''}<div class=sm>Выбери карту</div><div class=g>${MAPS.slice(0,3).map((m,i)=>`<div class=c onclick="pick(${i})"><img src="${thumb(i)}" style="width:100%;border-radius:8px"><b>${m.n}</b><div class=sm>${m.d}</div><div class=sm id=v${i}></div></div>`).join('')}</div>${mode=='online'?'<div class=sm>Хозяин комнаты выбирает финальную карту по своему голосу.</div>':'<button class=m onclick="menu()">Назад</button>'}</div>`)}

function pick(i){if(G.pmode=='bot')return startMatch('bot',i);if(votes.me!=null)return;votes.me=i;$('v'+i).textContent='✔ твой голос';RM&&RM.emit('vote',{m:i});if(G.host&&votes.o!=null)startNow(i)}
// ===== online (PeerJS) — работает на обычном сайте по https
let PEER=null,CONN=null,RM=null,HND={},pst={},votes={},lastP=0;
const myCode=()=>S.pid.slice(3),clean=s=>String(s||'Игрок').replace(/[<>&"'`]/g,'').slice(0,14);
function netInit(cb){if(typeof Peer=='undefined')return cb(false);if(PEER&&PEER.open)return cb(true);let done=0;const fin=v=>{if(!done){done=1;cb(v)}};
try{PEER=new Peer(S.pid);PEER.on('open',()=>fin(true));PEER.on('error',e=>{if(e.type=='unavailable-id'){done=1;S.pid='d3-'+Math.random().toString(36).slice(2,10);save();try{PEER.destroy()}catch(x){}PEER=null;netInit(cb)}else if(e.type!='peer-unavailable')fin(false)});PEER.on('connection',c=>c.on('data',m=>first(c,m)));setTimeout(()=>fin(false),9000)}catch(e){fin(false)}}
function first(c,m){if(c===CONN)return;const d=m.d||{};
if(m.t=='ping')c.send({t:'pong',d:{n:S.nick,b:G.run?1:0}});
else if(m.t=='join'){if(G.wait&&!CONN){c.send({t:'ok',d:{n:S.nick}});G.host=1;link(c,d.n)}else c.send({t:'no'})}
else if(m.t=='invite'){if(G.run||CONN)return c.send({t:'no'});if(confirm(clean(d.n)+' зовёт тебя на дуэль! Принять?')){c.send({t:'ok',d:{n:S.nick}});G.host=0;link(c,d.n)}else c.send({t:'no'})}}
function link(c,n){CONN=c;G.wait=0;G.opp={id:c.peer,n:clean(n)};HND={};pst={};
c.on('data',m=>{if(m.t=='p')pst=m.d;else if(HND[m.t])HND[m.t]({data:m.d,isMe:false})});
c.on('close',()=>{if(CONN!==c)return;CONN=null;RM=null;if(G.mode=='online'&&G.run){banner('Соперник вышел',3);setTimeout(()=>G.run&&endMatch(-1),2200)}});
RM={emit:(t,d)=>{try{c.open&&c.send({t,d})}catch(e){}return Promise.resolve()},presence:d=>{const n=performance.now();if(n-lastP>40&&c.open){lastP=n;try{c.send({t:'p',d})}catch(e){}}return Promise.resolve()},leave:()=>{try{c.close()}catch(e){}CONN=null}};
matchHandlers();G.mode='online';votes={};G.started=0;vote('online');if(G.host)setTimeout(()=>{if(!G.run&&G.mode=='online'&&!G.started&&RM)startNow(votes.me??0)},16000)}
function startNow(m){if(G.started)return;G.started=1;const sd=Math.random()*1e9|0;RM&&RM.emit('start',{m,seed:sd});startMatch('online',m,sd)}
function matchHandlers(){HND.vote=m=>{votes.o=m.data.m;const e=$('v'+m.data.m);if(e)e.textContent+=' 🗳 '+G.opp.n;if(G.host&&votes.me!=null)startNow(votes.me)};
HND.start=m=>{if(G.started)return;G.started=1;startMatch('online',m.data.m|0,m.data.seed|0)};
HND.shot=m=>{const d=m.data,o=V(...d.o),e=V(...d.e);tracer(o,e,W[d.w]?W[d.w].c:0xffffff);flashAt(o);sfx.shot(d.w,Math.max(.2,1-o.distanceTo(V(me.x,me.y,me.z))/30));if(d.n)impact(e,V(...d.n))};
HND.hit=m=>{if(!me.alive||G.over)return;kill(1,FXN[m.data.fx]!==undefined?m.data.fx:'rag',V(...m.data.d))};
HND.blind=m=>{sfx.flash();G.blind=3.5;const p=V(...m.data.p);for(let i=0;i<20;i++){const s=new T.Mesh(new T.SphereGeometry(rnd(.2,.5),8,8),bmat(0x050505,{transparent:true,opacity:.7}));s.position.copy(p).add(V(rnd(-.6,.6),rnd(-.6,.6),rnd(-.6,.6)));P(s,V(rnd(-1,1),rnd(0,1.5),rnd(-1,1)),{g:0,life:3})}};
HND.pad=m=>addPad(V(...m.data.p))}
function online(){ui(`<div class=p><h1>🌐 Онлайн</h1><div class=sm>Подключаюсь…</div></div>`);netInit(ok=>{if(!ok)return ui(`<div class=p><h1>🌐 Онлайн</h1><p>Нет связи с сервером матчей. Онлайн работает на опубликованном сайте (https) при доступе в интернет.</p><button class=m onclick="menu()">Назад</button></div>`);G.wait=1;onlineUI()})}
function onlineUI(){G.wait=1;ui(`<div class=p><h1>🌐 Онлайн</h1><div class=sm>Твой код (нажми, чтобы скопировать):</div><div class=code onclick="navigator.clipboard&&navigator.clipboard.writeText('${myCode()}')">${myCode()} 📋</div><div class=sm>Пока это окно открыто, друзья могут вызвать тебя или войти по коду.</div>

function friends(){const el=$('fl');if(!el)return;if(!S.fr.length){el.innerHTML='<div class=sm>Пока пусто. Добавь друга по коду или после матча.</div>';return}
el.innerHTML=S.fr.map((f,i)=>`<div class=fr><span id=fs${i}>⏳</span><b>${clean(f.n)}</b><button onclick="invite(${i})">Вызвать</button><button onclick="S.fr.splice(${i},1);save();onlineUI()">✕</button></div>`).join('');S.fr.forEach((f,i)=>chk(f.id,r=>{const e=$('fs'+i);if(e)e.textContent=r?(r.b?'🟡':'🟢'):'⚫'}))}
function chk(id,cb){let c,to;try{c=PEER.connect(id)}catch(e){return cb(0)}to=setTimeout(()=>{try{c.close()}catch(e){}cb(0)},3500);c.on('open',()=>c.send({t:'ping'}));c.on('data',m=>{if(m.t=='pong'){clearTimeout(to);cb(m.d);setTimeout(()=>c.close(),200)}})}
function addFr(code,name){code=(code||'').trim().replace(/^d3-/,'');if(code.length<4)return;const id='d3-'+code;if(id==S.pid||S.fr.find(f=>f.id==id))return;if(name){S.fr.push({id,n:name});save();return}chk(id,r=>{if(!r)return alert('Игрок не в сети или код неверный');S.fr.push({id,n:r.n});save();onlineUI()})}
function invite(i){const f=S.fr[i];let c;try{c=PEER.connect(f.id)}catch(e){return}const to=setTimeout(()=>{alert('Друг не отвечает');try{c.close()}catch(e){}},15000);c.on('open',()=>c.send({t:'invite',d:{n:S.nick}}));c.on('data',m=>{if(m.t=='ok'&&!CONN){clearTimeout(to);G.host=1;link(c,m.d.n)}else if(m.t=='no'){clearTimeout(to);alert('Друг отказался или занят')}})}
function joinCode(code){code=(code||'').trim().replace(/^d3-/,'');if(code.length<4)return;let c;try{c=PEER.connect('d3-'+code)}catch(e){return}const to=setTimeout(()=>{alert('Игрок не найден. Он должен открыть «Онлайн».');try{c.close()}catch(e){}},9000);c.on('open',()=>c.send({t:'join',d:{n:S.nick}}));c.on('data',m=>{if(m.t=='ok'&&!CONN){clearTimeout(to);G.host=0;link(c,m.d.n)}else if(m.t=='no'){clearTimeout(to);alert('Игрок занят')}})}

function card(id){const w=W[id];return`<div class=c style="border-color:${RC[w.r]}"><b style="color:${RC[w.r]}">${w.n}</b><div class=sm>${RN[w.r]}</div><div class=sm>${FXN[w.fx]||'обычная смерть'}</div>${S.own[id]?`<button class="m ${S.eq==id?'y':''}" style="padding:6px;margin:4px 0" onclick="S.eq='${id}';save();shop()">${S.eq==id?'Выбрано':'Взять'}</button>`:'<div class=sm>🔒</div>'}</div>`}
function shop(msg){equip();ui(`<div class=p><h1>🎁 Магазин</h1><div>🪙 <b>${S.coins}</b> ${msg||''}</div><h2>Кейсы</h2>${CASES.map((c,i)=>`<button class=m onclick="openCase(${i})">${c.n} — 🪙 ${c.p}</button>`).join('')}<h2>Способности · навсегда</h2>${Object.keys(PK).map(k=>`<div class=pk><span>${PK[k].i}</span><div><b>${PK[k].n}</b><div class=sm>${PK[k].d}</div></div>${S.perk[k]?'<em>✔</em>':`<button onclick="buyPk('${k}')">🪙 ${PK[k].p}</button>`}</div>`).join('')}<h2>Оружие</h2><div class=g>${Object.keys(W).map(card).join('')}</div><button class=m onclick="menu()">Назад</button></div>`)}
function buyPk(k){if(S.perk[k])return;if(S.coins<PK[k].p)return shop('— не хватает монет');S.coins-=PK[k].p;S.perk[k]=1;save();shop('✔ куплено')}
function openCase(i){const c=CASES[i];if(S.coins<c.p)return shop('— не хватает монет');S.coins-=c.p;let r=0,x=Math.random()*100;if(Math.random()<c.sec)r=4;else for(;r<3&&x>=c.w[r];r++)x-=c.w[r];const ids=Object.keys(W),pool=ids.filter(k=>W[k].r==r),id=pool[Math.random()*pool.length|0];
let n=0;const iv=setInterval(()=>{const q=W[ids[Math.random()*ids.length|0]];ui(`<div class=p style="text-align:center"><h1>Открываем…</h1><h2 style="color:${RC[q.r]}">${q.n}</h2></div>`);tone(400+n*40,.05,'square',.15);if(++n>14){clearInterval(iv);let t='';if(S.own[id]){S.coins+=RF[r];t=`Дубликат! +🪙${RF[r]}`}else S.own[id]=1;save();tone(800,.4,'triangle',.3,1600);ui(`<div class=p style="text-align:center"><h1 style="color:${RC[r]}">${RN[r]}!</h1><h2>${W[id].n}</h2><div class=sm>${FXN[W[id].fx]||''} ${t}</div><button class="m y" onclick="S.eq='${id}';save();shop()">Взять в руку</button><button class=m onclick="shop()">В магазин</button></div>`)}},110)}
